<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>AvisaTEC</title>
        <style>
            .calendar { font-family: Arial, sans-serif; max-width: 360px; border: 1px solid #ccc; padding: 10px; }
            .header { text-align: center; font-weight: bold; background: #f4f4f4; padding: 5px; text-transform: capitalize; }
            
            .weekdays { display: grid; grid-template-columns: repeat(8, 1fr); text-align: center; font-weight: bold; font-size: 0.8em; margin-top: 10px; }
            .days { display: grid; grid-template-columns: repeat(8, 1fr); text-align: center; margin-top: 5px; }
            
            .days div { padding: 10px 0; border: 1px solid #eee; }
            .days div:hover { background: #ddd; cursor: pointer; }
            
            .semana-col { background: #e8f4fd; color: #0066cc; font-weight: bold; border: 1px solid #bce0fd !important; cursor: default !important; }
            .semana-col:hover { background: #e8f4fd !important; } /* Evita el efecto gris al pasar el mouse */
            
            .today { background: #0066cc; color: white; font-weight: bold; }
        </style>
    </head>
    <body>
        <img
        src="imagenes/logoTecAzul.webp"
        alt = "Logo del Instituto Tecnológico de Costa Rica"
        height="65">
        <h1>AvisaTEC</h1>
    
        <!-- Inicio del calendario de eventos -->

        <div class="calendar">
            <div class="header" id="calendar-month">Cargando...</div>
            <div class="weekdays">
                <div style="color: #0066cc;">Sem</div>
                <div>Lu</div><div>Ma</div><div>Mi</div><div>Ju</div><div>Vi</div><div>Sa</div><div>Do</div>
            </div>
            <div class="days" id="calendar-days"></div>
        </div>
        <br>

        <script>
        function generarCalendario() {
            const fechaActual = new Date();
            const ano = fechaActual.getFullYear();
            const mes = fechaActual.getMonth(); 
            const diaHoy = fechaActual.getDate();

            // Colocar mes y año en el encabezado
            const opcionesMes = { month: 'long', year: 'numeric' };
            document.getElementById('calendar-month').innerText = fechaActual.toLocaleDateString('es-ES', opcionesMes);

            const primerDiaMes = new Date(ano, mes, 0).getDay(); 
            const totalDiasMes = new Date(ano, mes + 1, 0).getDate(); 

            const contenedorDias = document.getElementById('calendar-days');
            contenedorDias.innerHTML = ""; 

            // Sabemos que el 18 de mayo de 2026 empieza la Semana 13.
            // Calculamos qué semana le toca al día 1 del mes actual.
            const fecha18Mayo = new Date(2026, 4, 18); // 18 de Mayo
            const primerDiaFecha = new Date(ano, mes, 1);
        
            // Pasamos la diferencia de tiempo a días matemáticos simples
            const milisegundosPorDia = 24 * 60 * 60 * 1000;
            const diferenciaDias = Math.round((primerDiaFecha - fecha18Mayo) / milisegundosPorDia);
        
            // Calculamos cuántas semanas de desfase hay respecto a la semana 13
            // Usamos Math.floor para alinearlo con los bloques de 7 días (domingo a sábado de la cuadrícula)
            let semanaActual = 12 + Math.floor((diferenciaDias + primerDiaMes - 1) / 7);

            // 1. Crear la etiqueta de la primera fila de semanas
            let celdaSemana = document.createElement('div');
            celdaSemana.innerText = "S" + semanaActual;
            celdaSemana.classList.add('semana-col');
            contenedorDias.appendChild(celdaSemana);

            let contadorColumnas = 1; 

            // 2. Agregar los espacios en blanco del principio del mes (días antes del día 1)
            for (let i = 0; i < primerDiaMes; i++) {
                const espacioBlanco = document.createElement('div');
                contenedorDias.appendChild(espacioBlanco);
                contadorColumnas++;
            }

            // 3. Dibujar los días numéricos del mes
            for (let dia = 1; dia <= totalDiasMes; dia++) {
                // Si ya llenamos la fila de la cuadrícula (8 espacios: 1 semana + 7 días), saltamos
                if (contadorColumnas === 8) {
                    semanaActual++;
                    celdaSemana = document.createElement('div');
                    celdaSemana.innerText = "S" + semanaActual;
                    celdaSemana.classList.add('semana-col');
                    contenedorDias.appendChild(celdaSemana);
                    contadorColumnas = 1; 
                }

                const celdaDia = document.createElement('div');
                celdaDia.innerText = dia;

                if (dia === diaHoy) {
                    celdaDia.classList.add('today');
                }

                contenedorDias.appendChild(celdaDia);
               contadorColumnas++;
            }
        }

        generarCalendario();
        </script>

        <!-- Fin del calendario de eventos -->

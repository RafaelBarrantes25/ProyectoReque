<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>

        AvisaTEC | Crear cuenta

    </title>

    <link
    rel="stylesheet"
    href="../css/registrarEstRegular.css">

</head>

<body>

    <header class="barra-logo">

        <img
        src="../imagenes/logotecblanco.svg"
        alt="Logo del Instituto Tecnológico de Costa Rica"
        height="65">

    </header>

    <div class="barra-horizontal-roja"></div>

    <h1 class="titulo">

        Crear cuenta

    </h1>

    <h1 class="titulo">

        Estudiante regular

    </h1>

    <br><br>

    <form
    action="../includes/registro.php"
    method="POST">

        <label
        for="correo"
        class="texto-vacio">

            Correo:

        </label>

        <br>

        <input
        type="email"
        id="correo"
        name="correo"
        placeholder="correo@estudiantec.cr"
        required
        class="campo-vacio">

        <br><br>

        <label
        for="password"
        class="texto-vacio">

            Contraseña:

        </label>

        <br>

        <input
        type="password"
        id="password"
        name="password"
        minlength="8"
        required
        class="campo-vacio">

        <br><br>

        <!-- Asociación oculta -->

        <input
        type="hidden"
        name="asociacion"
        value="estudiante_regular">

        <input
        type="submit"
        value="Crear cuenta"
        class="campo-vacio">

    </form>

    <br><br>

    <ul>

        <a
        href="index.php"
        class="texto-vacio">

            Ya tengo una cuenta
            (iniciar sesión)

        </a>

        <br><br>

        <a
        href="registrar.php"
        class="texto-vacio">

            Soy miembro de una junta directiva
            de una asociación

        </a>

    </ul>

    <div class="barra-fondo-roja"></div>

    <br>

    <div class="barra-fondo-azul"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>

        AvisaTEC | Registro

    </title>

    <link
    rel="stylesheet"
    href="../css/registrar.css">

</head>

<body>

    <header class="barra-logo">

        <img
        src="../imagenes/logotecblanco.svg"
        alt="Logo del Instituto Tecnológico de Costa Rica"
        height="65">

    </header>

    <div class="barra-horizontal-roja"></div>

    <h1 class="titulo">

        Crear cuenta

    </h1>

    <br><br>

    <form
    action="../includes/registro.php"
    method="POST">

        <label
        for="correo"
        class="texto-vacio">

            Correo:

        </label>

        <br>

        <input
        type="email"
        id="correo"
        name="correo"
        placeholder="correo@estudiantec.cr"
        required
        class="campo-vacio">

        <br><br>

        <label
        for="password"
        class="texto-vacio">

            Contraseña:

        </label>

        <br>

        <input
        type="password"
        id="password"
        name="password"
        minlength="8"
        required
        class="campo-vacio">

        <br><br>

        <label
        for="asociacion"
        class="texto-vacio">

            Asociación:

        </label>

        <br>

        <select
        id="asociacion"
        name="asociacion"
        class="campo-vacio">

            <option value="computacion">

                Computación

            </option>

            <option value="materiales">

                Materiales

            </option>

            <option value="electronica">

                Electrónica

            </option>

        </select>

        <br><br>

        <input
        type="submit"
        value="Crear cuenta"
        class="campo-vacio">

    </form>

    <br><br>

    <a
    href="index.php"
    class="texto-vacio">

        Ya tengo una cuenta

    </a>

    <div class="barra-fondo-roja"></div>

    <div class="barra-fondo-azul"></div>

</body>
</html>

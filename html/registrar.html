<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>AvisaTEC | Crear cuenta</title>
        <link rel="stylesheet" href = "../css/registrar.css">
    </head>
    <body>
    <header class="barra-logo">
        <img src="../imagenes/logotecblanco.svg" alt="Logo del Instituto Tecnológico de Costa Rica" height="65">
    </header>
       
        <div class="barra-horizontal-roja"></div>
        <h1 class="titulo">Crear cuenta</h1>
        <h1 class="titulo">Miembro Junta Directiva de una asociación</h1>
        <br>
        <br>
        <form action="../php/index.php" method="POST">

            <label for="Correo" class="texto-vacio"> Correo: </label>
            <br>
            <input type="email" id="Correo"
            placeholder="correo@estudiantec.cr"
            required class="campo-vacio">
            <br>
            <br>


            <label for="Contraseña" class="texto-vacio"> Contraseña: </label>
            <br>
            <input type="password" id="Contraseña"
            minlength="8"
            required class="campo-vacio">
            <br>
            <br>

            <label for="asociacion" class="texto-vacio">Asociación:</label>
            <br>
            <select id="asociacion" class="campo-vacio">
                <option value="computacion">Computación</option>
                <option value="materiales">Materiales</option>
            </select>
            <br>
            <br>
            
            <input type="submit"
            value="Crear cuenta"  class="campo-vacio">
        </form>
        <br>
        <br>
        <ul>
            <a href="index.html" class="texto-vacio">
                Ya tengo una cuenta (iniciar sesión)
            </a>

            <a href="registrarEstRegular.html" class="texto-vacio">
                Soy un estudiante regular (Crear cuenta estudiante regular)
            </a>
        </ul>


        <div class="barra-fondo-roja"></div>
        <br>
        <div class="barra-fondo-azul"></div>
    </body>
</html>

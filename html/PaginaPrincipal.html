    <!-- JavaScript Calendario -->

    <script>

    function generarCalendario(){

        const fechaActual =
        new Date();

        const ano =
        fechaActual.getFullYear();

        const mes =
        fechaActual.getMonth();

        const diaHoy =
        fechaActual.getDate();

        // Mes y año

        const opcionesMes = {

            month: 'long',
            year: 'numeric'

        };

        document
        .getElementById(
            'calendar-month'
        )
        .innerText =
        fechaActual
        .toLocaleDateString(
            'es-ES',
            opcionesMes
        );

        // Primer día corregido

        let primerDiaMes =
        new Date(
            ano,
            mes,
            1
        ).getDay();

        primerDiaMes =
        (primerDiaMes + 6) % 7;

        // Total días

        const totalDiasMes =
        new Date(
            ano,
            mes + 1,
            0
        ).getDate();

        const contenedorDias =
        document.getElementById(
            'calendar-days'
        );

        contenedorDias.innerHTML =
        "";

        // Semana inicial

        let semanaActual = 1;

        let celdaSemana =
        document.createElement(
            'div'
        );

        celdaSemana.innerText =
        "S" + semanaActual;

        celdaSemana.classList.add(
            'semana-col'
        );

        contenedorDias.appendChild(
            celdaSemana
        );

        let contadorColumnas = 1;

        // Espacios vacíos

        for(
            let i = 0;
            i < primerDiaMes;
            i++
        ){

            const espacioBlanco =
            document.createElement(
                'div'
            );

            contenedorDias
            .appendChild(
                espacioBlanco
            );

            contadorColumnas++;
        }

        // Días

        for(
            let dia = 1;
            dia <= totalDiasMes;
            dia++
        ){

            if(
                contadorColumnas === 8
            ){

                semanaActual++;

                celdaSemana =
                document.createElement(
                    'div'
                );

                celdaSemana.innerText =
                "S" + semanaActual;

                celdaSemana.classList.add(
                    'semana-col'
                );

                contenedorDias
                .appendChild(
                    celdaSemana
                );

                contadorColumnas = 1;
            }

            const celdaDia =
            document.createElement(
                'div'
            );

            celdaDia.innerText =
            dia;

            if(
                dia === diaHoy
            ){

                celdaDia.classList.add(
                    'today'
                );
            }

            contenedorDias
            .appendChild(
                celdaDia
            );

            contadorColumnas++;
        }

    }

    generarCalendario();

    </script>
